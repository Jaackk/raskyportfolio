backend:
  name: git-gateway
  branch: main

site_url: https://raskyjack.com
display_url: https://raskyjack.com
logo_url: /assets/optimized/rasky-logo.jpg

media_folder: assets/uploads
public_folder: /assets/uploads

publish_mode: editorial_workflow

editor:
  preview: false

collections:
  - name: settings
    label: "Site Settings: Footer + Contact"
    description: "Global text, contact details, footer links and small site labels."
    files:
      - name: site
        label: "Site Settings"
        file: content/site.json
        format: json
        fields:
          - label: "Browser title"
            name: title
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
            hint: "Appears in the browser tab and search previews."
          - label: "Meta description"
            name: description
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: text
            hint: "Short search/social description for the main site."
          - label: "Header brand text"
            name: brand
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
          - label: "Contact email"
            name: contactEmail
            widget: string
            hint: "Used in footer/contact mail links. Example: hello@raskyjack.com"
          - label: "Home URL"
            name: homeUrl
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
            hint: "Usually /"
          - label: "Main music page URL"
            name: musicUrl
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
            hint: "Use /music/ for the current internal music page."
          - label: "External music site URL"
            name: musicExternalUrl
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
            required: false
            hint: "Optional old/current music website. External links should include https://"
          - label: "View counter label"
            name: viewCounterLabel
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
            hint: "Small footer label only. Example: Site views"
          - label: "Footer links"
            name: footerLinks
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: list
            summary: "{{fields.label}}"
            collapsed: false
            fields:
              - label: "Footer link label"
                name: label
                widget: string
              - label: "Footer link destination"
                name: href
                widget: string
                hint: "Use /internal-page/ or a full https:// URL."

  - name: homepage
    label: "Homepage: Hero, Cards, Core Ventures, Contact"
    description: "Main landing page content. Keep this concise and high-level."
    files:
      - name: homepage
        label: "Homepage"
        file: content/homepage.json
        format: json
        fields:
          - label: "Hero section"
            name: hero
            widget: object
            collapsed: false
            fields:
              - label: "Small hero label"
                name: label
                widget: string
                hint: "Short uppercase line above the headline."
              - label: "Hero headline"
                name: headline
                hint: "Wrap one word in *asterisks* to set it in italic colour, e.g. Not just somewhere to *drink*."
                widget: string
              - label: "Hero intro text"
                name: body
                widget: text
              - label: "Primary hero button"
                name: primaryButton
                hint: "Not shown in the current site design (kept so older content still loads)."
                widget: object
                fields: &button_fields
                  - label: "Button text"
                    name: label
                    widget: string
                    hint: "Leave blank only if this button should appear empty."
                  - label: "Button destination URL"
                    name: href
                    widget: string
                    hint: "Use /internal-page/ or https://external-site.com"
                  - label: "Open in new tab"
                    name: external
                    widget: boolean
                    required: false
                    default: false
              - label: "Secondary hero button"
                name: secondaryButton
                hint: "Not shown in the current site design (kept so older content still loads)."
                widget: object
                fields: *button_fields
              - label: "Floating hero cards"
                name: cards
                hint: "Not shown in the current site design (kept so older content still loads)."
                widget: list
                summary: "{{fields.title}}"
                hint: "Top floating cards in the hero. Recommended: three cards max."
                fields:
                  - label: "Card title"
                    name: title
                    widget: string
                  - label: "Small card label"
                    name: label
                    widget: string
                  - label: "Card destination URL"
                    name: link
                    widget: string
                  - label: "Card image"
                    name: image
                    widget: object
                    fields: &image_fields
                      - label: "Image / replacement image"
                        name: src
                        widget: image
                        required: false
                        hint: "Upload/select from Media. Existing paths such as assets/optimized/example.jpg still work."
                      - label: "Alt text"
                        name: alt
                        widget: string
                        required: false
                        hint: "Describe the image for accessibility."
          - label: "Core Ventures cards"
            name: coreVentures
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: list
            summary: "{{fields.title}}"
            hint: "Main venture cards on the homepage. Keep to Raskys and Raskyjack unless the homepage structure changes."
            fields:
              - label: "Venture title"
                name: title
                widget: string
              - label: "Short venture description"
                name: description
                widget: text
              - label: "Button text"
                name: buttonLabel
                hint: "Not shown in the current site design (kept so older content still loads)."
                widget: string
              - label: "Card/button destination URL"
                name: link
                widget: string
              - label: "Venture image"
                name: image
                widget: object
                fields: *image_fields
          - label: "Footer contact CTA"
            name: contact
            widget: object
            fields:
              - label: "Contact headline"
                name: headline
                widget: string
              - label: "Contact intro text"
                name: body
                widget: text
              - label: "Contact form button text"
                name: buttonLabel
                hint: "Not shown in the current site design (kept so older content still loads)."
                widget: string

  - name: raskys
    label: "Raskys: Venue Vision"
    description: "Homepage Raskys section plus the Raskys project page copy, PDF link and concept cards."
    files:
      - name: raskys
        label: "Raskys"
        file: content/raskys.json
        format: json
        fields:
          - label: "Homepage section label"
            name: label
            widget: string
          - label: "Homepage Raskys headline"
            name: headline
            hint: "Wrap one word in *asterisks* to set it in italic colour, e.g. Not just somewhere to *drink*."
            widget: string
          - label: "Homepage Raskys description"
            name: description
            widget: text
          - label: "Homepage Raskys button"
            name: button
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: object
            fields: *button_fields
          - label: "Blueprint image"
            name: blueprintImage
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: object
            fields: *image_fields
          - label: "Business plan PDF path"
            name: businessPlanPdf
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
            required: false
            hint: "Use Documents to upload PDFs into /assets/docs/, then paste the path here if needed."
          - label: "Raskys page headline"
            name: pageHeadline
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
            required: false
          - label: "Raskys page description"
            name: pageDescription
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: text
            required: false
          - label: "Raskys page primary button"
            name: pagePrimaryButton
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: object
            fields: *button_fields
          - label: "Business plan button"
            name: businessPlanButton
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: object
            fields: *button_fields
          - label: "Concept cards"
            name: concepts
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: "Concept card title"
                name: title
                widget: string
              - label: "Concept card description"
                name: description
                widget: text
          - label: "Raskys page vision card"
            name: vision
            widget: object
            fields:
              - label: "Vision title"
                name: title
                widget: string
              - label: "Vision description"
                name: description
                widget: text
              - label: "Vision quote"
                name: quote
                hint: "Not shown in the current site design (kept so older content still loads)."
                widget: string
              - label: "Vision gallery images"
                name: images
                hint: "Not shown in the current site design (kept so older content still loads)."
                widget: list
                summary: "{{fields.alt}}"
                fields: *image_fields

  - name: music
    label: "Music: Raskyjack"
    description: "Homepage music section, featured release, streaming links and release list."
    files:
      - name: music
        label: "Music"
        file: content/music.json
        format: json
        fields:
          - label: "Music section label"
            name: label
            widget: string
          - label: "Music headline"
            name: headline
            hint: "Wrap one word in *asterisks* to set it in italic colour, e.g. Not just somewhere to *drink*."
            widget: string
          - label: "Music intro text"
            name: description
            widget: text
          - label: "Spotify/main listening button"
            name: primaryButton
            widget: object
            fields: *button_fields
          - label: "Music page button"
            name: secondaryButton
            widget: object
            fields: *button_fields
          - label: "Artist streaming/social links"
            name: artistLinks
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: object
            required: false
            fields:
              - { label: "Spotify artist URL", name: spotify, widget: string, required: false, hint: "External links should include https://" }
              - { label: "Apple Music URL", name: appleMusic, widget: string, required: false }
              - { label: "YouTube URL", name: youtube, widget: string, required: false }
              - { label: "SoundCloud URL", name: soundCloud, widget: string, required: false }
              - { label: "TikTok URL", name: tiktok, widget: string, required: false }
              - { label: "Instagram URL", name: instagram, widget: string, required: false }
          - label: "Featured release"
            name: featuredRelease
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: object
            fields:
              - label: "Featured release title"
                name: title
                widget: string
              - label: "Featured release subtitle"
                name: subtitle
                widget: string
              - label: "Featured release artwork"
                name: image
                widget: object
                fields: *image_fields
          - label: "Discography small label"
            name: discographyLabel
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
          - label: "Discography heading"
            name: discographyTitle
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: string
          - label: "All music link"
            name: allMusicLink
            hint: "Not shown in the current site design (kept so older content still loads)."
            widget: object
            fields: *button_fields
          - label: "Releases / discography"
            name: releases
            widget: list
            summary: "{{fields.order}}. {{fields.title}}"
            collapsed: true
            fields:
              - label: "Show this release"
                name: visible
                widget: boolean
                required: false
                default: true
              - label: "Display order"
                name: order
                widget: number
                required: false
                value_type: int
                min: 1
                hint: "Lower numbers appear first."
              - label: "Release title"
                name: title
                widget: string
              - label: "Demo preview key"
                name: demoKey
                widget: string
                required: false
                hint: "Optional generated demo pattern key. Existing options: illusions, suffolk, sunburst, brick-by-brick."
              - label: "Release year"
                name: year
                widget: string
                required: false
              - label: "Release type"
                name: type
                widget: select
                required: false
                options: ["Album", "Single", "EP", "Upcoming", "Visual", "Other"]
              - label: "Displayed subtitle"
                name: subtitle
                widget: string
                required: false
                hint: "If blank, the site uses Type / Year where available."
              - label: "Playable audio file"
                name: audioSrc
                widget: file
                required: false
                hint: "Optional MP3/M4A preview played when visitors click the release artwork."
              - label: "Main release link"
                name: link
                widget: string
                required: false
                hint: "Usually Spotify. External links should include https://"
              - label: "Open main release link in new tab"
                name: external
                widget: boolean
                default: true
              - label: "Spotify link"
                name: spotifyLink
                widget: string
                required: false
              - label: "Apple Music link"
                name: appleMusicLink
                widget: string
                required: false
              - label: "YouTube link"
                name: youtubeLink
                widget: string
                required: false
              - label: "Album artwork"
                name: image
                widget: object
                fields: *image_fields

  - name: projects
    label: "Things I'm building: project list"
    description: "The 'And the rest' list on the homepage. Rockwater and Perfect Host are featured separately in the page itself."
    files:
      - name: projects
        label: "Project list"
        file: content/projects.json
        format: json
        fields:
          - label: "Projects"
            name: cards
            widget: list
            summary: "{{fields.order}}. {{fields.title}} ({{fields.status}})"
            fields:
              - label: "Show this project"
                name: visible
                widget: boolean
                required: false
                default: true
              - label: "Display order"
                name: order
                widget: number
                required: false
                value_type: int
                min: 1
              - label: "Project name"
                name: title
                widget: string
              - label: "One-line description"
                name: description
                widget: text
                hint: "One honest sentence: what it is."
              - label: "Status label"
                name: status
                widget: string
                required: false
                hint: "e.g. Working tool, Prototype, Early, In progress, Design"
              - label: "Status colour"
                name: statusKind
                widget: select
                required: false
                options:
                  - { label: "Working / live (green)", value: "live" }
                  - { label: "Prototype (amber)", value: "prototype" }
                  - { label: "Early / in progress (violet)", value: "early" }
                  - { label: "Design (red)", value: "design" }
              - label: "Link"
                name: link
                widget: string
                hint: "e.g. /etsycalc/ or https://..."
              - label: "Hover preview image (desktop)"
                name: image
                widget: object
                required: false
                fields: *image_fields

  - name: documents
    label: "Documents & PDFs"
    description: "Replace downloadable PDF files. Uploads from this section go into /assets/docs/."
    media_folder: assets/docs
    public_folder: /assets/docs
    files:
      - name: documents
        label: "Documents"
        file: content/documents.json
        format: json
        fields:
          - label: "CV PDF"
            name: cvPdf
            widget: file
            required: false
            hint: "Upload the latest CV PDF. Public link stays subtle on the About section."
          - label: "Raskys business plan PDF"
            name: raskysBusinessPlanPdf
            widget: file
            required: false
            hint: "Used by the Raskys page business plan link."
          - label: "Shnork preview PDF"
            name: shnorkPreviewPdf
            widget: file
            required: false
            hint: "Used by the Shnork preview/read buttons."
          - label: "Other downloadable files"
            name: otherFiles
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - label: "Document title"
                name: title
                widget: string
              - label: "PDF/document file"
                name: file
                widget: file
              - label: "Notes"
                name: notes
                widget: text
                required: false
