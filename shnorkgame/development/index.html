<script id="pub-data" type="application/json">{"v":1,"game":"In the Shadow of a Shnork","siteTitle":"Development Progress","updated":"2026-11-07","pages":{"overview":true,"roadmap":true,"dashboard":true,"fixes":true,"history":true,"items":true,"places":true},"intro":{"kicker":"A game in the making","title":"In the Shadow of a Shnork","tagline":"A forest that remembers. A creature that is not yet sure what it is.","lead":"An illustrated novel and a game that share a title and a world. The game is the book's forest made walkable: a hand-painted, living wilderness you wake up in, learn to survive in, and slowly come to understand.","story":["It begins with waking. Something small and green-handed opens its eyes among moss and bark. It has no name and no purpose, only a quiet question behind the eyes about what it is. The land around it is wild and watchful, and it seems to remember things the creature does not.","The Shnork is not quite a beast and not yet a hero. Memories that are not entirely its own surface as it grows; the forest teaches it hunger, shelter and fear; and something older than the forest is rising in the dark. The game follows that same road, from the first moss step toward the truth the book keeps buried.","The playable opening follows the book's first chapters: waking in the moss, finding food and water, making a nest, surviving the first night and meeting the Others. Everything past that point is still being built, and this page says plainly which parts."],"badgeNote":"Every card carries one badge. In the game means it has been played and seen working. Partly in the game means some of it is there but it is still being tested or finished. In development means the work is underway. Planned means it is an idea or a design so far. Badges only rise when the work has really been played."},"counts":{"ALREADY IN GAME":16,"PARTIALLY IMPLEMENTED":15,"IN DEVELOPMENT":2,"PLANNED":6},"sections":[{"id":"story","nav":"Story","title":"The story and the opening","lead":"How the game begins, and how far the playable story reaches today.","features":[{"id":"f1","title":"The illustrated opening","blurb":"A storybook-style opening wakes you into the forest: narrated, page-to-world, with the first steps handed to you in the final seconds.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"","note":"","shots":[]},{"id":"f2","title":"The first chapters, playable","blurb":"Waking, hunger, the stream, a nest, the first night, the Others. The book's later chapters are not adapted into the game yet.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f3","title":"The rest of the book","blurb":"Later chapters, and the hidden truths of the novel, are a long-term goal. Nothing is promised here beyond the opening.","tag":"","badge":"PLANNED","label":"Planned","newWork":"","note":"","shots":[]}]},{"id":"worlds","nav":"The world","title":"The world: Home Forest, the World Beyond and Rotwood","lead":"A sheltered forest at the centre, a wide wild country around it, and a dark place that is waiting for you.","features":[{"id":"f4","title":"The Home Forest","blurb":"The starting forest and sanctuary: a river and falls, a clearing, wildlife, your nest and building ground.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"","note":"","shots":["nooouqiujhjmvqst","ptnmmtmguqqtposi","tkrholkstrtgrrtv"]},{"id":"f5","title":"The World Beyond","blurb":"Corridors lead out of the Home into the wider land: the Vale and its waterfalls, Mossfall, Great Falls, the boundary mountains, the coast. It is an expedition zone with encounters, loot and recovery, streamed in as you walk.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"dev","note":"","shots":["kviptgjiijspgqkl","jopngtotvnphsvqo","vgpjjmksrmhuqnvp","qruukumhuqpghsrh","vimnjmjrshpqhguk"]},{"id":"f6","title":"Rotwood","blurb":"The corrupted forest to the north-west: blackened roots and thick fog. It unlocks after the tutorial and works as a co-op zone.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f7","title":"Weather, day and night","blurb":"Storms, world-space rain and thunder, fog-bound boundaries, a day and night cycle with moonlit nights.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"","note":"","shots":[]},{"id":"f8","title":"A new sea, beach and sky","blurb":"Turquoise-to-deep ocean with waves and foam, painterly skies, natural rivers, Mossfall and Great Falls rebuilt, and a more sinister Rotwood look.","tag":"","badge":"IN DEVELOPMENT","label":"In development","newWork":"","note":"","shots":[]},{"id":"f9","title":"Rotwood underground","blurb":"A plan to move Rotwood into an enormous cavern beneath the world. Brief and draft plan only.","tag":"","badge":"PLANNED","label":"Planned","newWork":"","note":"","shots":[]}]},{"id":"characters","nav":"Characters","title":"Playable characters and forms","lead":"You play a Shnork who grows through forms. Primal Shnorks are the wild kin you meet, not something you play.","features":[{"id":"f10","title":"Growing through forms","blurb":"A form set maps growth stages to bodies: Looma, then Shnork Level 1, 2 and 3. One animation set drives every form, so walking, running, jumping and fighting carry across as you grow.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f11","title":"Shnork, Level 1","blurb":"The default form at the start of the journey.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f12","title":"Shnork, Level 2","blurb":"The grown-in form, shown here holding a sword.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f13","title":"Shnork, Level 3","blurb":"The leaner, taller form with moss cloak, shown here with a bow.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f14","title":"Looma","blurb":"The youngest form in the set, round-eared and small.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f15","title":"Primal Shnorks","blurb":"The wild, ape-like kin of the forest: an ambient cast that sits and crouches in the Home Forest. They are characters in the world, not playable forms.","tag":"Not playable","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]}]},{"id":"skills","nav":"Skills","title":"Skills and progression","lead":"Twelve skills: nine established ones, plus Smithing, Cooking and Sailing.","features":[{"id":"f16","title":"Nine skills to level 99","blurb":"Mining, Woodcutting, Fishing, Farming, Construction, Crafting, Melee, Ranged and Magic, with Skills and Crafting tabs. Old Combat progress migrates into the three combat skills.","tag":"9 live skills","badge":"ALREADY IN GAME","label":"In the game","newWork":"tested","note":"","shots":["smilllqgpjjpoour"]},{"id":"f17","title":"Smithing, Cooking and Sailing","blurb":"Three new skills, taking the total to twelve, with a safe migration for existing saves and a rule that jobs using several skills pay out fairly.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f18","title":"Skill questlines","blurb":"Exploration, twelve-skill questlines and multi-skill adventures built on the quest engine.","tag":"","badge":"PLANNED","label":"Planned","newWork":"","note":"","shots":[]}]},{"id":"combat","nav":"Combat","title":"Combat, equipment and abilities","lead":"Melee, ranged and magic, a five-slot ability bar, skill-gated abilities and a dodge that rewards good timing.","features":[{"id":"f19","title":"Combat 2.0 and the ability bar","blurb":"A five-slot ability bar, melee combos and heavy strikes, bow shots, wand bolts, runes, dodge with a perfect-dodge window, and layered impact feedback.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"tested","note":"","shots":[]},{"id":"f20","title":"Weapons, armour and ammunition","blurb":"Swords and clubs, bows with arrows, wands with runes, and a set of living-wood gear dropped by the first boss.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"","note":"","shots":["njksjqkinntngsvt"]},{"id":"f21","title":"Seven level-gated abilities and a style switch","blurb":"Seven abilities that unlock as Melee, Ranged and Magic level up, piercing shots, a quick key to swap fighting style, and a guard kit: Guard, Parry, Riposte, Mana Shield and Mend.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f22","title":"Block, guard and smarter telegraphs","blurb":"A guard action and clearer enemy wind-ups with better AI.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]}]},{"id":"creatures","nav":"Creatures","title":"Creatures and wildlife","lead":"A living country: many creature types, plus the small wildlife of the forest.","features":[{"id":"f23","title":"New creature types","blurb":"Many new creature types, including tameable horses and stags, with the small wildlife of the forest alongside them.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"tested","note":"","shots":[]},{"id":"f24","title":"Forest wildlife","blurb":"Birds, frogs, hares and other small life that behave naturally in the Home Forest, with the bear as its great threat.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"","note":"","shots":[]},{"id":"f25","title":"Camps, patrols and living villagers","blurb":"Hostile groups, enemy camps and patrols, plus villagers with daily routines and work.","tag":"","badge":"PLANNED","label":"Planned","newWork":"","note":"","shots":[]}]},{"id":"crafting","nav":"Crafting","title":"Crafting, gathering and construction","lead":"Make it, mine it, grow it, build it.","features":[{"id":"f26","title":"The crafting book and hands-on crafting","blurb":"Recipes by category with station requirements, ammunition and runes, tool tiers, and a hands-on mode where you heat and strike metal on the beat.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"","note":"","shots":["goorqkigsmqrgurn","rqgilihukhkkougo","smilllqgpjjpoour"]},{"id":"f27","title":"Mining, woodcutting, fishing and farming","blurb":"Deposits, trees, fishing spots and crops feed the skills and the crafting book. Home deposits open once the tutorial teaches mining.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"tested","note":"","shots":[]},{"id":"f28","title":"Building in the Home Forest","blurb":"A build mode for placing structures, with its own skill and a free look-around while building.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"","note":"","shots":[]},{"id":"f29","title":"A settlement that grows","blurb":"Eleven arrivals tied to skill levels (sawmill, mine, forge, orchard, dock, tavern and more), and house interiors with a door cutscene.","tag":"","badge":"PLANNED","label":"Planned","newWork":"","note":"","shots":[]},{"id":"f30","title":"Boats and sailing","blurb":"Four boats have been chosen and prepared as art. Steering, sails, docks, boat fishing and the open sea are still to be built.","tag":"","badge":"IN DEVELOPMENT","label":"In development","newWork":"","note":"","shots":[]}]},{"id":"quests","nav":"Quests","title":"Quests","lead":"A guided first hour, then quests that grow out of the world.","features":[{"id":"f31","title":"The tutorial journey and quest engine","blurb":"Learning to Live teaches gathering, building and combat; a quest tracker and one-word context buttons guide you. The engine already supports talk, collect, defeat, visit, deliver and boss goals.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"tested","note":"","shots":[]},{"id":"f32","title":"The House That Grew","blurb":"A travelling builder wants a house in the Home Forest. Bring wood, stone, copper, iron and one rare ingredient and watch it rise in stages.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]},{"id":"f33","title":"Orchard, Forge, Village and the Seven Masters","blurb":"The Forgotten Orchard, the Blacksmith's Forge, A Village Worth Protecting, the Seven Forgotten Masters and a sailing questline.","tag":"","badge":"PLANNED","label":"Planned","newWork":"","note":"","shots":[]}]},{"id":"bosses","nav":"Bosses","title":"Bosses","lead":"Big fights that reward you with rare gear.","features":[{"id":"f34","title":"Mossheart, the Rootbound Titan","blurb":"A five-phase fight against a rootbound titan in a cave arena. Rewards include a set of living-wood weapons and armour, and a friend can join you.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"tested","note":"","shots":["njksjqkinntngsvt"]}]},{"id":"multiplayer","nav":"Multiplayer","title":"Multiplayer and modes","lead":"Play alone, or bring a friend.","features":[{"id":"f35","title":"A single-player journey","blurb":"Choose a journey from the menu; saves are kept and backed up on start.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"","note":"","shots":[]},{"id":"f36","title":"Co-op with friends","blurb":"Friends share the same forest, creatures, boss fights and rewards, and can revive each other when things go wrong.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"","note":"","shots":[]},{"id":"f37","title":"Touch controls","blurb":"An on-screen stick and action buttons; the interface is designed to scale to a phone.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]}]},{"id":"creative","nav":"Creative Suite","title":"The Creative Suite","lead":"A no-code world builder for shaping the world, quests, people and creatures.","features":[{"id":"f38","title":"Creative Suite 3.0","blurb":"Edit the real world: place objects and buildings from a large catalogue, paint terrain and vegetation, erase anything, place people and creatures, and make quests with a one-question wizard.","tag":"","badge":"ALREADY IN GAME","label":"In the game","newWork":"tested","note":"","shots":[]},{"id":"f39","title":"Multi-stage quests and more","blurb":"Quests with choices and world changes, resizable building pieces, a smarter asset browser and a simpler people inspector.","tag":"","badge":"PARTIALLY IMPLEMENTED","label":"Partly in the game","newWork":"","note":"","shots":[]}]}],"roadmap":[{"id":"t1","title":"Characters & Combat","era":"Now","icon":"sword","pitch":"Shnorks you want to stare at, and fights you can feel. Every form of the hero gets rebuilt where it matters - the bones, the skin, the way the arms hang - and every swing, shot and spell lands exactly when it looks like it should.","experience":["Your Shnork looks right from every angle, in every outfit, mid-roll or mid-swing.","One tap flips between sword, bow and wand, so you never dig through a menu mid-fight.","New abilities arrive as your Melee, Ranged and Magic skills climb: slams, whirlwinds, piercing arrows, frost bursts.","Hits have weight: a touch of hit-stop, a flash, a shove."],"soon":"Coming soon: tap-to-switch weapon style, plus seven level-unlocked abilities.","progress":40,"segments":[{"s":"Planned","pct":50},{"s":"Being tested","pct":50}]},{"id":"t2","title":"The House That Grew","era":"Now","icon":"house","pitch":"A wandering builder believes your forest is magic enough to grow a house. Bring him timber, stone, copper, iron and one strange glowing ingredient, and watch beams float into place and roots curl around the walls.","experience":["A home that visibly rises, stage by stage, as you deliver what it needs.","It belongs to you: friends can see it and walk in only if you invite them.","A magical little cutscene when the door opens, skippable any time."],"soon":"Coming soon: the first fully playable growing-house quest.","progress":49,"segments":[{"s":"Planned","pct":25},{"s":"In development","pct":25},{"s":"Being tested","pct":50}]},{"id":"t3","title":"Quests & the Home Forest","era":"Soon","icon":"leaf","pitch":"Your forest should grow with you. Chop enough trees and a lumberjack moves in; mine enough and a miner digs a shaft; learn smithing and a forge fires up. Quests change the world instead of just handing you chores.","experience":["A Forgotten Orchard to replant, a Blacksmith's Forge to relight, a Village Worth Protecting.","Eleven buildings that actually work: sawmill, mine, forge, tavern, dock, shrine.","Questlines for every skill, repeatable jobs, and adventures that need several skills at once."],"soon":"Coming soon: orchard, forge and village questlines.","progress":13,"segments":[{"s":"Planned","pct":83.3},{"s":"Being tested","pct":16.7}]},{"id":"t4","title":"Twelve Skills","era":"Soon","icon":"star","pitch":"Smithing, Cooking and Sailing join the nine skills you already train. Every action trains the skill you actually used, so forging feels like smithing and stirring a stew feels like cooking.","experience":["A twelve-tile skills grid, all the way to level 99.","Your old saves migrate safely: nothing you earned is lost.","Big jobs like building a boat train several skills, with the main one earning most of the XP."],"soon":"Coming soon: Smithing, Cooking and Sailing.","progress":60,"segments":[{"s":"Planned","pct":25},{"s":"Being tested","pct":75}]},{"id":"t5","title":"The Open Sea","era":"Soon","icon":"anchor","pitch":"Beyond the beach is turquoise water, hidden coves and the wrecks of ships nobody remembers. Build a boat, hoist a sail and go and see what is out there.","experience":["Climb aboard a hand-built rowboat and steer it out over rolling waves.","Fish from your deck and find different catches in different waters.","Handcrafted islands, shipwrecks and secret beaches that reward the curious.","Sail with friends on the same boat."],"soon":"Coming soon: four boats are modelled and waiting for water.","progress":14,"segments":[{"s":"Planned","pct":60},{"s":"In development","pct":40}]},{"id":"t6","title":"A Living World","era":"Soon","icon":"paw","pitch":"Villagers who go to work, sleep, wander to the market and notice you walking by. Wild herds, wolf packs and war bands that have their own business to attend to.","experience":["People with routines you can learn and quests that depend on them.","Camps, patrols and creature groups that behave like they live there.","Fifteen new creature types already roam the world, from gryphons to wild horses."],"soon":"Coming soon: NPC daily routines and hostile camps.","progress":44,"segments":[{"s":"In development","pct":80},{"s":"Being tested","pct":20}]},{"id":"t7","title":"Creative Suite","era":"Now","icon":"hammer","pitch":"A no-code world builder: paint land, place people, write quests and press Play From Here. If the game can do it, you can edit it.","experience":["Build a whole quest with one question and a few clicks.","An Eraser that cleans up anything, with undo and redo.","Resize buildings, edit NPC routines, drop in creatures, test in seconds."],"soon":"Coming soon: friendlier NPC panels and multi-stage quest building.","progress":59,"segments":[{"s":"Planned","pct":12.5},{"s":"In development","pct":25},{"s":"Being tested","pct":62.5}]},{"id":"t8","title":"World Beauty","era":"Later","icon":"mist","pitch":"Mist drifting between the trees, sunbeams through the canopy, rivers that actually wind and waterfalls with proper plunge pools. Leaving the Home Forest should feel like stepping into a painting.","experience":["Turquoise shallows, rolling surf and a painted sky.","Rivers and falls that follow the land.","No visible seams where one region meets the next.","A meteor you cannot miss: sky trail, rumble, and a glowing crater."],"soon":"Coming soon: sea, rivers and a meteor you cannot miss.","progress":37,"segments":[{"s":"Planned","pct":20},{"s":"In development","pct":60},{"s":"Being tested","pct":20}]},{"id":"t9","title":"Rotwood Underground","era":"Far horizon","icon":"cave","pitch":"Rotwood sinks beneath the mountains: an ancient, glowing, dangerous world of roots, caverns and black lakes. It will be the last thing built, so it can be done properly.","experience":["Descend through a memorable cave mouth hidden in the forest.","Enormous chambers lit by fungus and spores, with underground rivers.","The same corrupted heart, reborn as a subterranean ecosystem."],"soon":"Parked: the plan is written, the digging begins last.","progress":0,"segments":[{"s":"Planned","pct":100}]},{"id":"t10","title":"The Seven Forgotten Masters","era":"Far horizon","icon":"crown","pitch":"Seven masters once guarded the world's deepest crafts. Their forges, shrines and sanctuaries are lost; piece by piece you uncover who they were and what they left behind.","experience":["A forge inside a volcano, a mountain settlement to rebuild, a sanctuary under the sea.","Each master rewards a skill with real, permanent power.","A grand finale for everyone who has walked the whole world."],"soon":"Far off: the great late-game questline.","progress":0,"segments":[{"s":"Planned","pct":100}]}],"progress":{"milestones":[{"date":"2026-11-07","title":"Twelve skills","text":"Smithing, Cooking and Sailing are added, taking the game to twelve skills."},{"date":"2026-10-27","title":"Interface, combat and the first boss come together","text":"A refreshed interface, the new combat and the Mossheart boss fight are brought together for review."},{"date":"2026-10-23","title":"A world builder appears","text":"The no-code Creative Suite starts to take shape, so the world, its people and its quests can be built without writing code."},{"date":"2026-10-13","title":"The wide wo rs in one plan group in six.","Health bars in any zone. Bar lifecycle log."]},{"date":"2026-10-21","area":"Multiplayer","text":"Wildlife audit walks reachable paths. Follower gift (instinct offering on recruitment), guest puppet interpolation + height. Primal feet forward + stride-matched gait. Evolution stage replicated to…","bullets":["Looma faces forward (rest reference squares the sculpt's 28 deg shoulder twist). Action discs hug the corner. Quest text higher. Ambient butterflies reverted, every third open-land group is giant…","Render budget: haze-capped far clip, region haze, near-only shadow casters, budgeted cover ranges. Bear chase guide text.","Two bloom patches beside every wandering-Primal spot.","4th sword attack spin finisher. Prop culler exclusions.","Primals: copied body pose turned to face travel (feet unchanged), closed-loop step gain. Ground cover identical for both players and a little sparser.","Ground cover identical on every machine (governor no longer sheds cover range) and calmer by default: shorter, sparser near cover that fades into the ground.","World pass: mountains, peak clouds, coast (workstream M).","World pass: cave framework core (K).","Pass document and reports."]},{"date":"2026-10-20","area":"Characters","text":"Canonical Shnork rig. Shnork L1 + Looma L3 re-posed and re-skinned to one reference pose. Carried items on the visible hands.","bullets":["Beta 0.9: wildlife strikes.","Beta 0.9: one shared multiplayer world. Host weather + small life, no per-player deer. Mist never a veil.","Foliage plants back to their original look.","Primals upright + tan. Default Level 1 form.","Character pass: scramble climbing on steep slopes, head 10% smaller.","Character pass: start as Looma L3, eat the Pale Bloom and evolve to Shnork L1 (blended, trippy vision). Bare hands two beats.","Hostiles fight back + open-land groups + massive Vale bears + Stalker loot. Construction derives from progression. Host accepts riding speed and immobile drift."," mpact map objective card, region banner below the objective row, regions named at whole-world zoom.","Design system, world map, minimap, XP echo.","Refused-visit detection only while a join is in progress (loopback showed a normal leave mislabelled). Audit re-acquires across a pending Home reload.","Final audit + handoff.","Handoff, regression results, catalogue update.","Creatures face the Shnork and keep body distance."]},{"date":"2026-10-16","area":"Skills & crafting","text":"Add soft surface glow around precious mineral seams.","bullets":["Keep companion clear of stationary player and refine mineral crystals and sheen.","No bare ground between places. Plants stop at sand.","Strengthen mineral glow and bind Home placement assets.","Remove user-confirmed broadleaf glitter without hiding plants.","Wire native tree harvesting and durable regional resource placements.","Keep work approaches in the current camera basis."]},{"date":"2026-10-15","area":"Skills & crafting","text":"Implement isolated Home construction and gardens with shared skill economy.","bullets":["World Beyond streaming stage 2: 35 streamed tile scenes, predictive loading, rendered stand-ins, Home reload ground-order fix.","World Beyond in the real game.","Unified 0.9.0: the World Beyond as an expedition zone, world encounters and loot.","Unified 0.9.0: development free camera (F5) for looking over the map.","Add isolated five-skill groundwork and reversible activity presentation.","F01 free cam. Space flies up. Input blocked while flying (no dodge). Cursor locked for right-mouse look.","Smaller, dimmer quest glow (inside the trigger). Guide calls no longer a 471 Hz hoot every 11-22 s. A bird, 30-50 s apart. Owl spacing from the forest's start.","Fallen Giant walked on its bark.","Light shafts fade with distance, feathered edges, off at night. Ultra by default on desktop (saved choice kept, phones unchanged).","Hands-on issue register.","A solo host authorises its own safety step clear of a wedge (th nimation revolution: primal Shnorks, Looma, D hooks, smooth legs.","Chapters II and V authored on their own paintings. No teleport, return along the way in.","Leg continuity + Dodge verification fixes (protagonist only).","Push-off knee bend. Dodge roll timed to the slide (protagonist only)."]},{"date":"2026-10-06","area":"Build & tooling","text":"Strike tap in exploration.","bullets":["0.6.1 (16): physical-feedback polish pass.","Mobile UI revolution: point-based UI, map, field notes, pouch, settings, camera.","Character revolution: protagonist milestone (authored topology, rig, face, four gaits)."]},{"date":"2026-10-05","area":"World & environment","text":"0.4.4 (11): waterfall flows downward (time no longer scaled by position), flow-direction capture.","bullets":["Version 0.5.1 was put together.","Version 0.4.5 was put together.","Version 0.4.4 was put together.","Version 0.4.3 was put together.","0.4.4 (11): working edge fog (fence ring was published as 999 m), view-ray fog + drifting mist banks, arcing waterfall with plunge foam and spray, gorge rapids and mist, rain 20% lighter.","0.6.0 (15): major production polish."]},{"date":"2026-10-04","area":"World & environment","text":"Rebuild river and falls, ground all nature, tidy collision, rebuild hollow roots.","bullets":["Version 0.4.2 was put together.","Version 0.4.1 was put together.","Fix carry animation, marked-tree gouges and forest event audio.","Root-anchored wind, natural variety and stable vegetation visibility.","Weather states with storms, world-space rain, thunder and fog-bound boundary."]}]},"itemsNote":"The game's own item art: weapons, runes, arrows and armour as they appear in the inventory, with their names, tiers and descriptions.","itemGroups":[{"title":"Swords and blades","lead":"Melee weapons climb from stone to meteorite, with rare boss blades above them.","items":[{"name":"Stone sword","tag":"Stone tier, Combat 1","desc":"A chipped stone blade bound to a wooden grip.","img":"njktjuujrmsilpsi"},{"name":"Copper sword","tag":"Copper tier, Combat 3","desc":"A hammered copper blade.","img":"injrjugisnurukqu"},{"name":"Iron sword","tag":"Iron tier, Combat 6","desc":"A forged iron blade.","img":"ihqsoosikjmkgjip"},{"name":"Diamond sword","tag":"Diamond tier, Combat 10","desc":"A root-bound crystal blade.","img":"kvkgpuhjmphslhmp"},{"name":"Meteorite sword","tag":"Meteorite tier, Combat 15","desc":"Star-fallen metal, heavy and keen.","img":"tiqpiussgoqpqqjr"},{"name":"Mossheart greatblade","tag":"Boss drop, Combat 20","desc":"Heartwood grown around a titan's thorn. Dropped only by Mossheart.","img":"lvtrqgshiolgmklh"}]},{"title":"Bows","lead":"Ranged weapons that loose arrows on their own once you select a target.","items":[{"name":"Wooden bow","tag":"Wood tier, Combat 1","desc":"A bent length of dry wood strung with vine.","img":"jriltppqlqqnokgv"},{"name":"Copper bow","tag":"Copper tier, Combat 3","desc":"Copper-capped limbs and a cordage string. A steadier, harder draw.","img":"umunnnqivqjqglns"},{"name":"Diamond bow","tag":"Diamond tier, Combat 10","desc":"Crystal-set limbs. Long reach, quick release.","img":"hjruhhpohqktvtpi"},{"name":"Meteorite bow","tag":"Meteorite tier, Combat 15","desc":"Star-metal limbs. The longest, fastest of the crafted bows.","img":"qqkhrkqsrhrhtopi"},{"name":"Mossheart rootbow","tag":"Boss drop, Combat 20","desc":"Living root limbs that still creak. Dropped only by Mossheart.","img":"inrpvvuotpiunvvr"}]},{"title":"Wands and staffs","lead":"Magic weapons that cast with the rune you choose.","items":[{"name":"Wooden wand","tag":"Wood tier, Combat 1","desc":"A carved twig that hums with the forest.","img":"umpvjimninlulvti"},{"name":"Copper wand","tag":"Copper tier, Combat 3","desc":"Copper-wound wood that carries a spell further.","img":"mnhvqkmqjpthmvtm"},{"name":"Diamond wand","tag":"Diamond tier, Combat 10","desc":"A crystal focus. Bright, quick casts.","img":"tukonlnonvlslusn"},{"name":"Meteorite wand","tag":"Meteorite tier, Combat 15","desc":"Star-metal focus. The strongest crafted casts.","img":"stvimimigukgisjv"},{"name":"Mossheart's Wrath","tag":"Boss drop, Combat 20","desc":"A sliver of the titan's moss core, warm to the touch.","img":"gkoghlmsojnsipns"},{"name":"Mossheart staff","tag":"Boss drop, Combat 20","desc":"A staff of living heartwood that channels the titan's ancient power.","img":"uogqjrjiossihnro"}]},{"title":"Runes","lead":"Spent when a wand casts. Runes are not tiered like weapons: every rune is equally strong, and each one does something different.","items":[{"name":"Nature rune","tag":"Mends and roots","desc":"Living green magic: each hit mends you a little and roots the target for a moment. Cheap enough to cast all day.","img":"ntklvgmgtnovruln"},{"name":"Fire rune","tag":"Burns","desc":"Sets the target burning, for damage over time.","img":"nkmmstojklhgvjvn"},{"name":"Frost rune","tag":"Slows","desc":"Rime that slows the target's movement and attacks.","img":"lkkngrugjlqpkuup"},{"name":"Storm rune","tag":"Chains","desc":"Lightning that leaps to two more enemies nearby.","img":"mppliglhpvumjggl"},{"name":"Meteorite rune","tag":"Staggers and splashes","desc":"A slow, heavy star-stone strike that staggers and splashes.","img":"ghgqugissovvlkmu"},{"name":"Ancient rune","tag":"Bursts and heals","desc":"Rare old power: a great burst around the target that also restores some of your health. Must be chosen by hand.","img":"pghrhnmpoioujlkv"}]},{"title":"Arrows","lead":"Six kinds, crafted in tens. Heavier heads knock back, crystal tips pass through an enemy, star-metal bursts on impact.","items":[{"name":"Wooden arrow","tag":"Wood tier","desc":"Fire-hardened wooden points. Cheap and plentiful.","img":"mmpuqooogvpgguqq"},{"name":"Stone arrow","tag":"Stone tier","desc":"Knapped stone heads. Heavier, they knock enemies back a little more.","img":"jrjvivrrooorugvl"},{"name":"Copper arrow","tag":"Copper tier","desc":"Copper broadheads.","img":"uthhgvhhusopgqvm"},{"name":"Iron arrow","tag":"Iron tier","desc":"Iron bodkins that bite deep.","img":"trhtgihkrtktngvo"},{"name":"Diamond arrow","tag":"Diamond tier","desc":"Crystal tips. Flies flat and passes through one enemy.","img":"tullosukjqsjtvvk"},{"name":"Meteorite arrow","tag":"Meteorite tier","desc":"Star-metal heads that burst on impact, hurting enemies close by.","img":"muokkpglvsknhkjg"}]},{"title":"Armour","lead":"The Mossheart set, dropped by the Rootbound Titan.","items":[{"name":"Mossheart Robe Top","tag":"Body","desc":"Leafy heartwood robe worn over the chest.","img":"qpjqokpoglikpjoi"},{"name":"Mossheart Robe Bottom","tag":"Legs","desc":"The matching leaf skirt of the set.","img":"lsjqlqpuuvljssrv"},{"name":"Mossheart Boots","tag":"Feet","desc":"Vine-wrapped boots.","img":"mprtirjnpkkjqnoi"},{"name":"Mossheart Amulet","tag":"Neck","desc":"A living wreath around a glowing green heart.","img":"tgmiqvrgunlgrujv"}]},{"title":"Woodcutting axes","lead":"Gathering tools that sit beside the weapons: the head changes with the tier.","items":[{"name":"Wood axe","tag":"Tool","desc":"The first woodcutting tool, made from dry wood and vine.","img":"rnqnrotrnkgttggs"},{"name":"Stone axe","tag":"Tool","desc":"A knapped stone head on a wooden haft.","img":"hrgtoirhskpkpssh"},{"name":"Copper axe","tag":"Tool","desc":"A copper head bound in leather.","img":"svsrjitmurrouunt"},{"name":"Iron axe","tag":"Tool","desc":"An iron head with a riveted collar.","img":"ojpsniijpkoqvqrs"},{"name":"Diamond axe","tag":"Tool","desc":"A crystal-set axe that glows blue.","img":"mivppjvhipkpkiho"}]}],"places":["nooouqiujhjmvqst","kviptgjiijspgqkl","ptnmmtmguqqtposi","vimnjmjrshpqhguk","ggjkirshmkrrusgv","sksnstsuihusurtn","qruukumhuqpghsrh"],"placesNote":"A few corners of the forest and the wide country around it, as the game renders them.","hero":["qruukumhuqpghsrh","nooouqiujhjmvqst","kviptgjiijspgqkl","ggjkirshmkrrusgv"],"imagesNote":"Screenshots from the game.","media":{"nooouqiujhjmvqst":{"file":"img/nooouq
